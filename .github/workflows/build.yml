name: Build OpenWrt for GL-BE14000

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Publish the image as a GitHub release
        type: boolean
        default: true
      force:
        description: Build even if upstream has not moved
        type: boolean
        default: true
  schedule:
    - cron: '0 */4 * * *'

permissions:
  contents: write

env:
  UPSTREAM_REPO: https://github.com/JiaY-shi/openwrt.git
  UPSTREAM_BRANCH: flint4-support
  PANEL_FEED: https://github.com/blogic/feed-blogic.git
  PANEL_LUCI: https://github.com/Beaverfffan/glinet-panel.git

jobs:
  check:
    name: Check upstream
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.probe.outputs.sha }}
      short: ${{ steps.probe.outputs.short }}
      should_build: ${{ steps.probe.outputs.should_build }}
    steps:
      - name: Probe upstream head and existing releases
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git ls-remote "$UPSTREAM_REPO" "refs/heads/$UPSTREAM_BRANCH" | cut -f1)
          if [ -z "$sha" ]; then
            echo "could not resolve $UPSTREAM_BRANCH on $UPSTREAM_REPO"
            exit 1
          fi
          short=${sha:0:7}
          echo "sha=$sha"     >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.force }}" = "true" ]; then
            reason="manual run with force"
            build=true
          elif gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
               --json tagName --jq '.[].tagName' | grep -q -- "-${short}$"; then
            reason="a release for ${short} already exists"
            build=false
          else
            reason="no release for ${short} yet"
            build=true
          fi

          echo "should_build=$build" >> "$GITHUB_OUTPUT"
          {
            echo "### upstream check"
            echo ""
            echo "- branch: \`$UPSTREAM_BRANCH\` at \`$short\`"
            echo "- decision: **$( [ "$build" = true ] && echo build || echo skip )** — $reason"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$reason -> build=$build"

  build:
    name: GL-BE14000 (mediatek/filogic)
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-22.04

    steps:
      - name: Free up disk space
        run: |
          echo "before:"
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/lib/node_modules \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          sudo apt-get clean
          echo "after:"
          df -h /
          {
            echo "### disk after cleanup"
            echo '```'
            df -h /
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: ci

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync \
            unzip zlib1g-dev file wget device-tree-compiler swig time ccache

      - name: Clone OpenWrt tree at the checked commit
        run: |
          mkdir openwrt && cd openwrt
          git init -q
          git remote add origin "$UPSTREAM_REPO"
          git fetch -q --depth 1 origin "${{ needs.check.outputs.sha }}"
          git checkout -q FETCH_HEAD
          echo "::notice title=Baseline::$(git log -1 --oneline)"

      - name: Add blogic feed for the TFT panel
        run: |
          cd openwrt
          echo "src-git blogic $PANEL_FEED" >> feeds.conf.default
          git clone --depth 1 "$PANEL_LUCI" /tmp/glinet-panel
          cp -r /tmp/glinet-panel/luci-app-glinet-panel package/
          cat feeds.conf.default

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          sed -i '/^src-git blogic /d' feeds.conf.default
          echo "blogic dropped from feeds.conf.default after install:"
          cat feeds.conf.default

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: openwrt/.ccache
          key: ccache-${{ env.UPSTREAM_BRANCH }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.UPSTREAM_BRANCH }}-

      - name: Seed target configuration
        run: |
          cd openwrt
          cp ../ci/config/be14000.config .config
          make defconfig

      - name: Verify configuration
        run: |
          cd openwrt
          for opt in \
            CONFIG_TARGET_mediatek=y \
            CONFIG_TARGET_mediatek_filogic=y \
            CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_glinet_gl-be14000=y \
            CONFIG_PACKAGE_luci=y \
            CONFIG_PACKAGE_glinet-panel-ui=y \
            CONFIG_PACKAGE_luci-app-glinet-panel=y \
            CONFIG_PACKAGE_ucode-mod-lvgl=y \
            CONFIG_PACKAGE_kmod-hwmon-pwmfan=y \
            CONFIG_PACKAGE_adguardhome=y \
            CONFIG_PACKAGE_nlbwmon=y \
            CONFIG_PACKAGE_kmod-nf-conntrack-netlink=y \
            CONFIG_PACKAGE_luci-theme-material=y \
            CONFIG_PACKAGE_luci-i18n-base-pl=y
          do
            if grep -qx "$opt" .config; then
              echo "ok   $opt"
            else
              echo "FAIL $opt is missing from .config"
              exit 1
            fi
          done
          if grep -qx 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_glinet_gl-be14000-ubootmod=y' .config; then
            echo "FAIL the ubootmod variant is selected - it replaces the vendor bootloader"
            exit 1
          fi
          echo "configuration looks sane"

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc)
          df -h /

      - name: Compile firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Report space after build
        if: always()
        run: df -h /

      - name: Collect images
        id: collect
        run: |
          cd openwrt/bin/targets/mediatek/filogic
          ls -lh
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp -v *glinet_gl-be14000*.bin "$GITHUB_WORKSPACE/out/"
          cp -v sha256sums config.buildinfo "$GITHUB_WORKSPACE/out/" || true
          cp -v *glinet_gl-be14000*.manifest "$GITHUB_WORKSPACE/out/" || true
          echo "stamp=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Confirm panel packages are in the image
        run: |
          cd openwrt/bin/targets/mediatek/filogic
          m=$(ls *glinet_gl-be14000*.manifest 2>/dev/null | head -1)
          if [ -z "$m" ]; then
            echo "no manifest produced - skipping the check"
            exit 0
          fi
          for pkg in luci-app-glinet-panel glinet-panel-ui ucode-mod-lvgl \
                     glinet-panel-firmware kmod-hwmon-pwmfan luci \
                     adguardhome nlbwmon luci-theme-material luci-i18n-base-pl; do
            if grep -q "^${pkg} " "$m"; then
              echo "ok   $pkg"
            else
              echo "FAIL $pkg did not make it into the image"
              exit 1
            fi
          done
          {
            echo "### packages in image"
            echo '```'
            echo "$(wc -l < "$m") packages total"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm blogic is not a runtime repository
        run: |
          cd openwrt
          f=$(find build_dir -path '*/root-mediatek/etc/apk/repositories.d/*' -name '*.list' 2>/dev/null | head -1)
          if [ -z "$f" ]; then
            echo "no repositories.d list found in the staged rootfs - skipping"
            exit 0
          fi
          echo "runtime repositories:"
          cat "$f"
          if grep -q blogic "$f"; then
            echo "FAIL blogic is listed as a runtime repo - apk update will break on the missing index"
            exit 1
          fi
          echo "ok   blogic is build-time only"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gl-be14000-${{ steps.collect.outputs.stamp }}
          path: out/
          retention-days: 30
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'schedule' || inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-${{ steps.collect.outputs.stamp }}-${{ needs.check.outputs.short }}
          name: GL-BE14000 ${{ steps.collect.outputs.stamp }}
          body: |
            Automated OpenWrt build for the GL.iNet Flint 4 (GL-BE14000).

            Source: `JiaY-shi/openwrt` @ `flint4-support`, commit `${{ needs.check.outputs.short }}`
            Panel UI: `blogic/feed-blogic` + `Beaverfffan/glinet-panel`

            Flash `*-squashfs-factory.bin` from the GL.iNet U-Boot web recovery.
            Use `*-squashfs-sysupgrade.bin` for later upgrades from LuCI.

            Unofficial build. No warranty. Verify the recovery procedure before flashing.
          files: out/*
          fail_on_unmatched_files: true
