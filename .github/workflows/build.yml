name: Build OpenWrt for GL-BE14000

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Publish the image as a GitHub release
        type: boolean
        default: true
      force:
        description: Build even if upstream has not moved
        type: boolean
        default: true
  schedule:
    - cron: '0 */4 * * *'

permissions:
  contents: write

env:
  UPSTREAM_REPO: https://github.com/JiaY-shi/openwrt.git
  UPSTREAM_BRANCH: flint4-support
  PANEL_FEED: https://github.com/blogic/feed-blogic.git
  PANEL_LUCI: https://github.com/Beaverfffan/glinet-panel.git
  # Feed packages whose updates should trigger a rebuild. The feed itself is
  # fetched unpinned at build time, but its movement alone never starts one.
  FEED_REPO: openwrt/packages
  FEED_BRANCH: master
  # Mainline moved device-node handling into *-support packages on 2026-09-29
  # and the packages feed began depending on them hours later. A base tree
  # without them cannot use the feed past this commit: libdrm drops out, and
  # the panel UI with it. The hold lifts itself once the base tree catches up.
  PACKAGES_HOLD: 059ba7d4fda5cb00f429f49b1061fb81e121456c
  FEED_WATCH: >-
    net/adguardhome
    net/acme-acmesh
    net/acme-common
    net/vnstat2
    net/nlbwmon
    lang/golang
  # LuCI packages in the image. Their code and Polish translations are watched;
  # translations into other languages never reach the image.
  LUCI_REPO: https://github.com/openwrt/luci.git
  LUCI_BRANCH: master
  LUCI_WATCH: >-
    collections/luci
    collections/luci-light
    collections/luci-ssl
    modules/luci-base
    modules/luci-mod-admin-full
    modules/luci-mod-dashboard
    modules/luci-mod-network
    modules/luci-mod-status
    modules/luci-mod-system
    applications/luci-app-acme
    applications/luci-app-firewall
    applications/luci-app-nlbwmon
    applications/luci-app-package-manager
    applications/luci-app-vnstat2
    libs/luci-lib-chartjs
    libs/luci-lib-jsonc
    libs/luci-lib-uqr
    libs/rpcd-mod-luci
    protocols/luci-proto-ipv6
    protocols/luci-proto-ppp
    themes/luci-theme-bootstrap
    themes/luci-theme-footstrap
    themes/luci-theme-material

jobs:
  check:
    name: Check upstream
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.probe.outputs.sha }}
      short: ${{ steps.probe.outputs.short }}
      self: ${{ steps.probe.outputs.self }}
      feeds: ${{ steps.probe.outputs.feeds }}
      watched: ${{ steps.probe.outputs.watched }}
      should_build: ${{ steps.probe.outputs.should_build }}
    steps:
      - name: Probe upstream head and existing releases
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git ls-remote "$UPSTREAM_REPO" "refs/heads/$UPSTREAM_BRANCH" | cut -f1)
          if [ -z "$sha" ]; then
            echo "could not resolve $UPSTREAM_BRANCH on $UPSTREAM_REPO"
            exit 1
          fi
          short=${sha:0:7}
          self=$(echo "$GITHUB_SHA" | cut -c1-7)

          # Mirror the feed hold the build applies, so the fingerprint describes
          # the feed state that actually goes into the image.
          up=${UPSTREAM_REPO#https://github.com/}; up=${up%.git}
          if gh api "repos/$up/contents/package/system/hardware-support/Makefile?ref=$sha" \
               --jq .content 2>/dev/null | base64 -d | grep -q 'define Package/video-support'; then
            feed_ref=$FEED_BRANCH
          else
            feed_ref=$PACKAGES_HOLD
          fi

          # Fingerprint the last commit touching each watched feed package, so
          # a new version of any of them counts as a change too.
          watched=""
          [ "$feed_ref" = "$FEED_BRANCH" ] || watched="packages-held@${feed_ref:0:7}"
          for p in $FEED_WATCH; do
            c=$(gh api "repos/$FEED_REPO/commits?path=$p&sha=$feed_ref&per_page=1" --jq '.[0].sha // empty')
            if [ -z "$c" ]; then
              echo "could not resolve the last commit of $p in $FEED_REPO"
              exit 1
            fi
            watched="$watched ${p##*/}@${c:0:7}"
          done

          # LuCI: the API cannot leave out other languages' translations, so
          # use a small blobless clone. In a shallow clone the oldest commit
          # looks as if it added every file, so it must never count as a change.
          l=$(mktemp -d)
          git clone -q --filter=blob:none --no-checkout --depth=300 \
              --single-branch --branch "$LUCI_BRANCH" "$LUCI_REPO" "$l"
          boundary=" $(tr '\n' ' ' < "$l/.git/shallow") "
          last() {
            local c
            c=$(git -C "$l" log -1 --format=%H -- "$@")
            case "$boundary" in *" $c "*) c="" ;; esac
            echo "${c:-none}"
          }
          code=$(last $LUCI_WATCH ':(exclude,glob)**/po/**')
          plp=""
          for p in $LUCI_WATCH; do plp="$plp $p/po/pl"; done
          pl=$(last $plp)
          if [ "$code" = none ]; then
            echo "no LuCI code change in the last 300 commits - clone too shallow?"
            exit 1
          fi
          watched="$watched luci@${code:0:7} luci-pl@${pl:0:7}"
          watched=${watched# }
          feeds=$(printf '%s' "$watched" | sha256sum | cut -c1-7)

          echo "sha=$sha"         >> "$GITHUB_OUTPUT"
          echo "short=$short"     >> "$GITHUB_OUTPUT"
          echo "self=$self"       >> "$GITHUB_OUTPUT"
          echo "feeds=$feeds"     >> "$GITHUB_OUTPUT"
          echo "watched=$watched" >> "$GITHUB_OUTPUT"
          suffix="${short}-${self}-${feeds}"

          # A run already building this commit has not published its release
          # yet, so the release list alone cannot see it. Count sibling runs on the
          # same commit to avoid duplicating a build that is still in flight.
          inflight=$(gh run list --repo "$GITHUB_REPOSITORY" --limit 50 \
                       --json databaseId,headSha,status \
                       --jq '.[] | select(.status == "in_progress" or .status == "queued")
                                 | "\(.databaseId) \(.headSha)"' \
                     | grep " ${GITHUB_SHA}$" \
                     | grep -vc "^${GITHUB_RUN_ID} " || true)

          if [ "${{ inputs.force }}" = "true" ]; then
            reason="manual run with force"
            build=true
          elif gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
               --json tagName --jq '.[].tagName' | grep -q -- "-${suffix}$"; then
            reason="a release for ${suffix} already exists"
            build=false
          elif [ "${inflight:-0}" -gt 0 ]; then
            reason="${inflight} run(s) already building ${self}; it just has not published yet"
            build=false
          else
            reason="no release for ${suffix} yet"
            build=true
          fi

          echo "should_build=$build" >> "$GITHUB_OUTPUT"
          {
            echo "### upstream check"
            echo ""
            echo "- upstream: \`$UPSTREAM_BRANCH\` at \`$short\`"
            echo "- this repository: \`$self\`"
            echo "- watched feed packages: \`$watched\` → \`$feeds\`"
            echo "- decision: **$( [ "$build" = true ] && echo build || echo skip )** — $reason"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$reason -> build=$build"

  build:
    name: GL-BE14000 (mediatek/filogic)
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-22.04

    steps:
      - name: Free up disk space
        run: |
          echo "before:"
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/lib/node_modules \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          sudo apt-get clean
          echo "after:"
          df -h /
          {
            echo "### disk after cleanup"
            echo '```'
            df -h /
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: ci

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync \
            unzip zlib1g-dev file wget device-tree-compiler swig time ccache \
            squashfs-tools

      - name: Clone OpenWrt tree at the checked commit
        run: |
          mkdir openwrt && cd openwrt
          git init -q
          git remote add origin "$UPSTREAM_REPO"
          git fetch -q --depth 1 origin "${{ needs.check.outputs.sha }}"
          git checkout -q FETCH_HEAD
          echo "::notice title=Baseline::$(git log -1 --oneline)"

      - name: Add blogic feed for the TFT panel
        run: |
          cd openwrt
          echo "src-git blogic $PANEL_FEED" >> feeds.conf.default
          git clone --depth 1 "$PANEL_LUCI" /tmp/glinet-panel
          cp -r /tmp/glinet-panel/luci-app-glinet-panel package/
          cat feeds.conf.default

      - name: Update and install feeds
        run: |
          cd openwrt
          if ! grep -qs 'define Package/video-support' package/system/hardware-support/Makefile; then
            sed -i "s|^src-git packages \([^ ^;]*\).*|src-git packages \1^$PACKAGES_HOLD|" feeds.conf.default
            echo "::warning title=packages feed held::the base tree predates mainline's *-support packages - packages feed pinned to ${PACKAGES_HOLD:0:7}"
          fi
          grep '^src-git packages ' feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          sed -i '/^src-git blogic /d' feeds.conf.default
          echo "blogic dropped from feeds.conf.default after install:"
          cat feeds.conf.default

      - name: Add files overlay
        run: cp -rv ci/files openwrt/

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: openwrt/.ccache
          key: ccache-${{ env.UPSTREAM_BRANCH }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.UPSTREAM_BRANCH }}-

      - name: Seed target configuration
        run: |
          cd openwrt
          cp ../ci/config/be14000.config .config
          make defconfig

      - name: Verify configuration
        run: |
          cd openwrt
          for opt in \
            CONFIG_TARGET_mediatek=y \
            CONFIG_TARGET_mediatek_filogic=y \
            CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_glinet_gl-be14000=y \
            CONFIG_PACKAGE_luci=y \
            CONFIG_PACKAGE_glinet-panel-ui=y \
            CONFIG_PACKAGE_luci-app-glinet-panel=y \
            CONFIG_PACKAGE_ucode-mod-lvgl=y \
            CONFIG_PACKAGE_kmod-hwmon-pwmfan=y \
            CONFIG_PACKAGE_adguardhome=y \
            CONFIG_PACKAGE_nlbwmon=y \
            CONFIG_PACKAGE_kmod-nf-conntrack-netlink=y \
            CONFIG_PACKAGE_luci-theme-material=y \
            CONFIG_LUCI_LANG_pl=y \
            CONFIG_PACKAGE_luci-i18n-base-pl=y
          do
            if grep -qx "$opt" .config; then
              echo "ok   $opt"
            else
              echo "FAIL $opt is missing from .config"
              exit 1
            fi
          done
          if grep -qx 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_glinet_gl-be14000-ubootmod=y' .config; then
            echo "FAIL the ubootmod variant is selected - it replaces the vendor bootloader"
            exit 1
          fi
          echo "configuration looks sane"

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc)
          df -h /

      - name: Compile firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Report space after build
        if: always()
        run: df -h /

      - name: Collect images
        id: collect
        run: |
          cd openwrt/bin/targets/mediatek/filogic
          ls -lh
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp -v *glinet_gl-be14000*.bin "$GITHUB_WORKSPACE/out/"
          cp -v sha256sums config.buildinfo feeds.buildinfo "$GITHUB_WORKSPACE/out/" || true
          cp -v *glinet_gl-be14000*.manifest "$GITHUB_WORKSPACE/out/" || true
          echo "stamp=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Verify the shipped image
        run: |
          # Checks the rootfs inside the sysupgrade image itself. The earlier
          # checks read a staging copy and a manifest apk builds never produce,
          # so they silently passed.
          cd openwrt/bin/targets/mediatek/filogic
          img=$(ls *glinet_gl-be14000*-squashfs-sysupgrade.bin | head -1)
          work=$(mktemp -d)
          tar -xf "$img" -C "$work" 2>/dev/null || true
          sq=$(find "$work" -type f -name root | head -1)
          if [ -z "$sq" ]; then
            echo "FAIL no rootfs found inside $img"
            exit 1
          fi
          unsquashfs -q -d "$work/rootfs" "$sq" etc/apk etc/uci-defaults >/dev/null || true
          r="$work/rootfs"
          fail=0

          for pkg in luci-app-glinet-panel glinet-panel-ui ucode-mod-lvgl \
                     glinet-panel-firmware kmod-hwmon-pwmfan luci \
                     adguardhome nlbwmon vnstat2 luci-theme-material luci-i18n-base-pl \
                     acme-acmesh acme-acmesh-dnsapi luci-app-acme; do
            if grep -qE "^${pkg}([=<>~]|$)" "$r/etc/apk/world" 2>/dev/null; then
              echo "ok   $pkg"
            else
              echo "FAIL $pkg did not make it into the image"
              fail=1
            fi
          done

          d="$r/etc/apk/repositories.d/distfeeds.list"
          if ! grep -q 'downloads.openwrt.org' "$d" 2>/dev/null; then
            echo "FAIL the image has no distfeeds.list with the official feeds"
            fail=1
          elif grep -q blogic "$d"; then
            echo "FAIL blogic is a runtime repo - apk update would break on its missing index"
            fail=1
          else
            echo "ok   blogic is build-time only"
          fi

          if [ -f "$r/etc/uci-defaults/99-drop-target-feed" ]; then
            echo "ok   the target repo is dropped on first boot"
          else
            echo "FAIL the files overlay did not reach the image"
            fail=1
          fi

          {
            echo "### packages in image"
            echo '```'
            echo "$(wc -l < "$r/etc/apk/world") packages in world"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $fail

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gl-be14000-${{ steps.collect.outputs.stamp }}
          path: out/
          retention-days: 30
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'schedule' || inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-${{ steps.collect.outputs.stamp }}-${{ needs.check.outputs.short }}-${{ needs.check.outputs.self }}-${{ needs.check.outputs.feeds }}
          name: GL-BE14000 ${{ steps.collect.outputs.stamp }}
          body: |
            Automated OpenWrt build for the GL.iNet Flint 4 (GL-BE14000).

            Source: `JiaY-shi/openwrt` @ `flint4-support`, commit `${{ needs.check.outputs.short }}`
            Built from this repository at `${{ needs.check.outputs.self }}`
            Watched feed packages: `${{ needs.check.outputs.watched }}` (fingerprint `${{ needs.check.outputs.feeds }}`)
            Panel UI: `blogic/feed-blogic` + `Beaverfffan/glinet-panel`

            Install `*-squashfs-sysupgrade.bin` from the stock firmware over SSH with
            `sysupgrade -n`. `*-squashfs-factory.bin` carries no OpenWrt metadata and
            both GL.iNet flashing paths reject it - see the README.
            Later upgrades: flash the same sysupgrade image from LuCI, keeping settings.

            Unofficial build. No warranty. Verify the recovery procedure before flashing.
          files: out/*
          fail_on_unmatched_files: true
